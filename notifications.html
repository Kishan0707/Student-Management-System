<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications — EduManage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<div id="toast-container"></div>
<div id="sidebar"></div>

<div id="main-content">
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-6 py-3 flex items-center justify-between gap-4" id="navbar"></header>

  <main class="p-6 page-enter">
    <!-- Toolbar -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div class="flex items-center gap-3">
        <select id="notif-filter" onchange="renderNotifications()" class="form-input w-40 py-2">
          <option value="">All Types</option>
          <option value="success">Success</option>
          <option value="warning">Warning</option>
          <option value="error">Alert</option>
          <option value="info">Info</option>
        </select>
        <select id="notif-read-filter" onchange="renderNotifications()" class="form-input w-36 py-2">
          <option value="">All</option>
          <option value="unread">Unread</option>
          <option value="read">Read</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="markAllRead()" class="btn btn-secondary text-sm">Mark All Read</button>
        <button onclick="openNotifModal()" class="btn btn-primary text-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          New Notification
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div id="notif-stats" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-5"></div>

    <!-- Notifications List -->
    <div class="card overflow-hidden">
      <div id="notif-list" class="divide-y divide-slate-100 dark:divide-slate-700"></div>
      <div id="notif-empty" class="hidden text-center py-16 text-slate-400">
        <div class="text-4xl mb-3">🔔</div>
        <div class="font-medium">No notifications</div>
      </div>
    </div>
  </main>
</div>

<!-- New Notification Modal -->
<div id="notif-modal" class="modal-overlay" onclick="if(event.target===this)Modal.close('notif-modal')">
  <div class="modal-box max-w-md">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">New Notification</h2>
      <button onclick="Modal.close('notif-modal')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="notif-form" onsubmit="saveNotification(event)" novalidate>
      <div class="space-y-4">
        <div>
          <label class="form-label">Title *</label>
          <input name="title" class="form-input" placeholder="Notification title"/>
          <div class="form-error" data-error="title"></div>
        </div>
        <div>
          <label class="form-label">Message *</label>
          <textarea name="message" class="form-input" rows="3" placeholder="Notification message…"></textarea>
          <div class="form-error" data-error="message"></div>
        </div>
        <div>
          <label class="form-label">Type</label>
          <select name="type" class="form-input">
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="error">Alert</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button type="button" onclick="Modal.close('notif-modal')" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Send</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  renderSidebar('notifications');
  renderNavbar('Notifications');
  renderNotifStats();
  renderNotifications();
});

const TYPE_CONFIG = {
  success: { color: '#10b981', bg: 'bg-green-50 dark:bg-green-900/20', border: 'border-green-200 dark:border-green-800', icon: '✅', badge: 'badge-green' },
  warning: { color: '#f59e0b', bg: 'bg-yellow-50 dark:bg-yellow-900/20', border: 'border-yellow-200 dark:border-yellow-800', icon: '⚠️', badge: 'badge-yellow' },
  error:   { color: '#ef4444', bg: 'bg-red-50 dark:bg-red-900/20', border: 'border-red-200 dark:border-red-800', icon: '🚨', badge: 'badge-red' },
  info:    { color: '#6366f1', bg: 'bg-indigo-50 dark:bg-indigo-900/20', border: 'border-indigo-200 dark:border-indigo-800', icon: 'ℹ️', badge: 'badge-blue' }
};

function renderNotifStats() {
  const notifs = Store.get('notifications');
  const unread = notifs.filter(n => !n.read).length;
  const stats = [
    { label: 'Total', value: notifs.length, color: 'text-slate-700 dark:text-slate-200', bg: '' },
    { label: 'Unread', value: unread, color: 'text-indigo-600', bg: 'bg-indigo-50 dark:bg-indigo-900/30' },
    { label: 'Alerts', value: notifs.filter(n => n.type === 'error').length, color: 'text-red-500', bg: 'bg-red-50 dark:bg-red-900/30' },
    { label: 'Warnings', value: notifs.filter(n => n.type === 'warning').length, color: 'text-yellow-600', bg: 'bg-yellow-50 dark:bg-yellow-900/30' }
  ];
  document.getElementById('notif-stats').innerHTML = stats.map(s => `
    <div class="stat-card ${s.bg}">
      <div class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">${s.label}</div>
      <div class="text-2xl font-bold ${s.color}">${s.value}</div>
    </div>`).join('');
}

function renderNotifications() {
  const typeFilter = document.getElementById('notif-filter').value;
  const readFilter = document.getElementById('notif-read-filter').value;
  let notifs = Store.get('notifications');

  if (typeFilter) notifs = notifs.filter(n => n.type === typeFilter);
  if (readFilter === 'unread') notifs = notifs.filter(n => !n.read);
  if (readFilter === 'read') notifs = notifs.filter(n => n.read);

  const list = document.getElementById('notif-list');
  const empty = document.getElementById('notif-empty');

  if (!notifs.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  list.innerHTML = notifs.map(n => {
    const cfg = TYPE_CONFIG[n.type] || TYPE_CONFIG.info;
    return `
      <div class="flex items-start gap-4 px-6 py-4 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors ${n.read ? 'opacity-60' : ''}" id="notif-${n.id}">
        <div class="w-10 h-10 rounded-xl ${cfg.bg} border ${cfg.border} flex items-center justify-center text-lg flex-shrink-0">${cfg.icon}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                ${n.title}
                ${!n.read ? `<span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>` : ''}
              </div>
              <div class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${n.message}</div>
              <div class="text-xs text-slate-400 mt-1.5 flex items-center gap-3">
                <span>${n.time}</span>
                <span class="badge ${cfg.badge}">${n.type}</span>
              </div>
            </div>
            <div class="flex items-center gap-1 flex-shrink-0">
              ${!n.read ? `<button onclick="markRead('${n.id}')" class="p-1.5 rounded-lg hover:bg-green-50 dark:hover:bg-green-900/30 text-green-500 transition-colors" title="Mark as read">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              </button>` : ''}
              <button onclick="deleteNotif('${n.id}')" class="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-red-400 transition-colors" title="Delete">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function markRead(id) {
  Store.update('notifications', id, { read: true });
  renderNotifStats();
  renderNotifications();
  renderNavbar('Notifications');
}

function markAllRead() {
  const notifs = Store.get('notifications').map(n => ({ ...n, read: true }));
  Store.set('notifications', notifs);
  renderNotifStats();
  renderNotifications();
  renderNavbar('Notifications');
  Toast.show('All notifications marked as read', 'success');
}

function deleteNotif(id) {
  Store.remove('notifications', id);
  renderNotifStats();
  renderNotifications();
  renderNavbar('Notifications');
}

function openNotifModal() {
  document.getElementById('notif-form').reset();
  Modal.open('notif-modal');
}

function saveNotification(e) {
  e.preventDefault();
  const form = document.getElementById('notif-form');
  const data = Object.fromEntries(new FormData(form));
  if (!data.title.trim()) return Toast.show('Title is required', 'error');
  if (!data.message.trim()) return Toast.show('Message is required', 'error');

  Store.push('notifications', {
    id: genId(),
    title: data.title,
    message: data.message,
    type: data.type,
    time: 'Just now',
    read: false
  });

  Modal.close('notif-modal');
  Toast.show('Notification sent', 'success');
  renderNotifStats();
  renderNotifications();
  renderNavbar('Notifications');
}
</script>
</body>
</html>
