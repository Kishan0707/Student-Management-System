<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — EduManage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
  >
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Main Content -->
    <div id="main-content">
      <!-- Navbar -->
      <header
        class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-6 py-3 flex items-center justify-between gap-4"
        id="navbar"
      ></header>

      <!-- Page Content -->
      <main class="p-6 page-enter">
        <!-- Stats Grid -->
        <div
          id="stats-grid"
          class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5 mb-6"
        >
          <!-- Skeleton -->
          <div class="stat-card">
            <div class="skeleton h-4 w-24 mb-3"></div>
            <div class="skeleton h-8 w-16 mb-2"></div>
            <div class="skeleton h-3 w-32"></div>
          </div>
          <div class="stat-card">
            <div class="skeleton h-4 w-24 mb-3"></div>
            <div class="skeleton h-8 w-16 mb-2"></div>
            <div class="skeleton h-3 w-32"></div>
          </div>
          <div class="stat-card">
            <div class="skeleton h-4 w-24 mb-3"></div>
            <div class="skeleton h-8 w-16 mb-2"></div>
            <div class="skeleton h-3 w-32"></div>
          </div>
          <div class="stat-card">
            <div class="skeleton h-4 w-24 mb-3"></div>
            <div class="skeleton h-8 w-16 mb-2"></div>
            <div class="skeleton h-3 w-32"></div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-6">
          <!-- Enrollment Chart -->
          <div class="card p-6 lg:col-span-2">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="font-semibold text-slate-800 dark:text-slate-100">
                  Student Enrollment
                </h3>
                <p class="text-xs text-slate-400 mt-0.5">
                  Monthly trend this year
                </p>
              </div>
              <span class="badge badge-blue">2024</span>
            </div>
            <div class="chart-container" style="height: 220px">
              <canvas id="enrollmentChart"></canvas>
            </div>
          </div>
          <!-- Attendance Donut -->
          <div class="card p-6">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="font-semibold text-slate-800 dark:text-slate-100">
                  Attendance
                </h3>
                <p class="text-xs text-slate-400 mt-0.5">This month</p>
              </div>
            </div>
            <div
              class="chart-container flex items-center justify-center"
              style="height: 180px"
            >
              <canvas id="attendanceChart"></canvas>
            </div>
            <div class="flex justify-center gap-4 mt-3">
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
                <span class="text-xs text-slate-500 dark:text-slate-400"
                  >Present</span
                >
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bg-red-400"></div>
                <span class="text-xs text-slate-500 dark:text-slate-400"
                  >Absent</span
                >
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <span class="text-xs text-slate-500 dark:text-slate-400"
                  >Holiday</span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <!-- Fee Collection Chart -->
          <div class="card p-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-semibold text-slate-800 dark:text-slate-100">
                Fee Collection
              </h3>
              <span class="badge badge-green">Monthly</span>
            </div>
            <div class="chart-container" style="height: 180px">
              <canvas id="feeChart"></canvas>
            </div>
          </div>

          <!-- Recent Students -->
          <div class="card p-6 lg:col-span-2">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-semibold text-slate-800 dark:text-slate-100">
                Recent Enrollments
              </h3>
              <a
                href="students.html"
                class="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline"
                >View all →</a
              >
            </div>
            <div id="recent-students" class="space-y-3"></div>
          </div>
        </div>

        <!-- Class Performance -->
        <div class="card p-6 mt-5">
          <div class="flex items-center justify-between mb-5">
            <h3 class="font-semibold text-slate-800 dark:text-slate-100">
              Class Performance Overview
            </h3>
            <a
              href="results.html"
              class="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline"
              >View results →</a
            >
          </div>
          <div
            id="class-performance"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"
          ></div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="components.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        renderSidebar("dashboard");
        renderNavbar("Dashboard");

        const students = Store.get("students");
        const fees = Store.get("fees");
        const attendance = Store.get("attendance");
        const results = Store.get("results");

        // ── Stats ──
        const totalStudents = students.length;
        const activeStudents = students.filter(
          (s) => s.status === "Active",
        ).length;
        const totalFees = fees.reduce((a, f) => a + f.totalFee, 0);
        const collectedFees = fees.reduce((a, f) => a + f.paidAmount, 0);
        const feePercent = Math.round((collectedFees / totalFees) * 100);

        // Attendance rate
        let present = 0,
          total = 0;
        Object.values(attendance).forEach((days) => {
          Object.values(days).forEach((v) => {
            total++;
            if (v === "present") present++;
          });
        });
        const attRate = total ? Math.round((present / total) * 100) : 0;

        const avgResult = results.length
          ? Math.round(
              results.reduce((a, r) => a + r.percentage, 0) / results.length,
            )
          : 0;

        const statsData = [
          {
            label: "Total Students",
            value: totalStudents,
            sub: `${activeStudents} active`,
            icon: "👨‍🎓",
            color: "bg-indigo-100 dark:bg-indigo-900/40",
            iconColor: "text-indigo-600",
            trend: "+3 this month",
          },
          {
            label: "Attendance Rate",
            value: `${attRate}%`,
            sub: "This month",
            icon: "✅",
            color: "bg-green-100 dark:bg-green-900/40",
            iconColor: "text-green-600",
            trend: attRate >= 80 ? "↑ Good" : "↓ Needs attention",
          },
          {
            label: "Fee Collection",
            value: `${feePercent}%`,
            sub: `$${(collectedFees / 1000).toFixed(1)}k of $${(totalFees / 1000).toFixed(1)}k`,
            icon: "💰",
            color: "bg-yellow-100 dark:bg-yellow-900/40",
            iconColor: "text-yellow-600",
            trend: `${fees.filter((f) => f.status === "Pending").length} pending`,
          },
          {
            label: "Avg. Score",
            value: `${avgResult}%`,
            sub: "Mid-Term 2024",
            icon: "📊",
            color: "bg-purple-100 dark:bg-purple-900/40",
            iconColor: "text-purple-600",
            trend: avgResult >= 75 ? "↑ Above average" : "↓ Below average",
          },
        ];

        document.getElementById("stats-grid").innerHTML = statsData
          .map(
            (s) => `
    <div class="stat-card">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">${s.label}</p>
          <p class="text-3xl font-bold text-slate-800 dark:text-slate-100 mt-1">${s.value}</p>
          <p class="text-xs text-slate-400 mt-1">${s.sub}</p>
        </div>
        <div class="w-12 h-12 rounded-xl ${s.color} flex items-center justify-center text-2xl">${s.icon}</div>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">
        <span class="text-xs font-medium ${s.trend.includes("↑") ? "text-green-600" : s.trend.includes("↓") ? "text-red-500" : "text-slate-400"}">${s.trend}</span>
      </div>
    </div>`,
          )
          .join("");

        // ── Charts ──
        const isDark = document.documentElement.classList.contains("dark");
        const gridColor = isDark
          ? "rgba(255,255,255,0.06)"
          : "rgba(0,0,0,0.06)";
        const textColor = isDark ? "#94a3b8" : "#64748b";

        // Enrollment Chart
        new Chart(document.getElementById("enrollmentChart"), {
          type: "line",
          data: {
            labels: [
              "Jan",
              "Feb",
              "Mar",
              "Apr",
              "May",
              "Jun",
              "Jul",
              "Aug",
              "Sep",
              "Oct",
              "Nov",
              "Dec",
            ],
            datasets: [
              {
                label: "Students",
                data: [28, 32, 35, 30, 38, 42, 39, 45, 48, 44, 50, 52],
                borderColor: "#6366f1",
                backgroundColor: "rgba(99,102,241,0.1)",
                borderWidth: 2.5,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointBackgroundColor: "#6366f1",
                pointBorderColor: "#fff",
                pointBorderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: {
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 11 } },
              },
              y: {
                grid: { color: gridColor },
                ticks: { color: textColor, font: { size: 11 } },
              },
            },
          },
        });

        // Attendance Donut
        const absent = total - present;
        const holiday = Object.values(attendance).reduce(
          (a, days) =>
            a + Object.values(days).filter((v) => v === "holiday").length,
          0,
        );
        new Chart(document.getElementById("attendanceChart"), {
          type: "doughnut",
          data: {
            labels: ["Present", "Absent", "Holiday"],
            datasets: [
              {
                data: [present, absent - holiday, holiday],
                backgroundColor: ["#6366f1", "#f87171", "#fbbf24"],
                borderWidth: 0,
                hoverOffset: 6,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "72%",
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: { label: (ctx) => ` ${ctx.label}: ${ctx.parsed}` },
              },
            },
          },
        });

        // Fee Bar Chart
        new Chart(document.getElementById("feeChart"), {
          type: "bar",
          data: {
            labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
            datasets: [
              {
                label: "Collected ($)",
                data: [45000, 52000, 48000, 61000, 55000, 67000],
                backgroundColor: "rgba(99,102,241,0.8)",
                borderRadius: 6,
                borderSkipped: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: textColor, font: { size: 11 } },
              },
              y: {
                grid: { color: gridColor },
                ticks: {
                  color: textColor,
                  font: { size: 11 },
                  callback: (v) => "$" + v / 1000 + "k",
                },
              },
            },
          },
        });

        // ── Recent Students ──
        const recent = [...students].slice(-5).reverse();
        document.getElementById("recent-students").innerHTML = recent
          .map(
            (s) => `
    <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
      <div class="avatar text-sm font-semibold" style="background:${avatarColor(s.name)};color:#fff">${s.avatar}</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-slate-800 dark:text-slate-100 truncate">${s.name}</div>
        <div class="text-xs text-slate-400">${s.rollNo} · Class ${s.class}</div>
      </div>
      <span class="badge ${s.status === "Active" ? "badge-green" : "badge-red"}">${s.status}</span>
    </div>`,
          )
          .join("");

        // ── Class Performance ──
        const classes = [...new Set(students.map((s) => s.class))].sort();
        document.getElementById("class-performance").innerHTML = classes
          .map((cls) => {
            const classResults = results.filter((r) => r.class === cls);
            const avg = classResults.length
              ? Math.round(
                  classResults.reduce((a, r) => a + r.percentage, 0) /
                    classResults.length,
                )
              : 0;
            const count = students.filter((s) => s.class === cls).length;
            const color =
              avg >= 80 ? "#10b981" : avg >= 60 ? "#6366f1" : "#f59e0b";
            return `
      <div class="p-4 rounded-xl border border-slate-100 dark:border-slate-700 hover:border-indigo-200 dark:hover:border-indigo-700 transition-colors">
        <div class="flex items-center justify-between mb-3">
          <span class="font-semibold text-slate-800 dark:text-slate-100">Class ${cls}</span>
          <span class="text-sm font-bold" style="color:${color}">${avg}%</span>
        </div>
        <div class="progress-bar mb-2">
          <div class="progress-fill" style="width:${avg}%;background:${color}"></div>
        </div>
        <div class="text-xs text-slate-400">${count} students · ${classResults.length} results</div>
      </div>`;
          })
          .join("");
      });

      function avatarColor(name) {
        const colors = [
          "#6366f1",
          "#8b5cf6",
          "#ec4899",
          "#f59e0b",
          "#10b981",
          "#3b82f6",
          "#ef4444",
        ];
        return colors[name.charCodeAt(0) % colors.length];
      }
    </script>
  </body>
</html>
