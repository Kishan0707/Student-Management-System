<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance — EduManage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
  >
    <div id="toast-container"></div>
    <div id="sidebar"></div>

    <div id="main-content">
      <header
        class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-6 py-3 flex items-center justify-between gap-4"
        id="navbar"
      ></header>

      <main class="p-6 page-enter">
        <!-- Controls -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div class="flex flex-wrap items-center gap-3">
            <select
              id="att-class-filter"
              name="att-class-filter"
              onchange="loadAttendance()"
              class="form-input w-36 py-2"
            >
              <option value="">All Classes</option>
              <option>10-A</option>
              <option>10-B</option>
              <option>11-A</option>
              <option>11-B</option>
              <option>12-A</option>
              <option>12-B</option>
            </select>
            <div class="search-bar w-56">
              <svg
                class="w-4 h-4 text-slate-400 flex-shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"
                />
              </svg>
              <input
                id="att-search"
                type="text"
                placeholder="Search student…"
                oninput="loadAttendance()"
              />
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="markAllPresent()" class="btn btn-success text-sm">
              ✅ Mark All Present
            </button>
            <button
              onclick="exportAttendance()"
              class="btn btn-secondary text-sm"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                />
              </svg>
              Export
            </button>
          </div>
        </div>

        <!-- Stats Row -->
        <div
          id="att-stats"
          class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-5"
        ></div>

        <!-- Chart + Legend -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
          <div class="card p-6 lg:col-span-2">
            <h3 class="font-semibold text-slate-800 dark:text-slate-100 mb-4">
              Weekly Attendance Trend
            </h3>
            <div style="height: 200px">
              <canvas id="att-trend-chart"></canvas>
            </div>
          </div>
          <div class="card p-6">
            <h3 class="font-semibold text-slate-800 dark:text-slate-100 mb-4">
              Today's Summary
            </h3>
            <div id="today-summary" class="space-y-3"></div>
          </div>
        </div>

        <!-- Attendance Table -->
        <div class="card overflow-hidden">
          <div
            class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between"
          >
            <h3 class="font-semibold text-slate-800 dark:text-slate-100">
              Student Attendance — <span id="current-month">Month</span>
            </h3>
            <div class="flex items-center gap-3 text-xs">
              <span class="flex items-center gap-1.5"
                ><span class="w-3 h-3 rounded bg-green-200 inline-block"></span
                >Present</span
              >
              <span class="flex items-center gap-1.5"
                ><span class="w-3 h-3 rounded bg-red-200 inline-block"></span
                >Absent</span
              >
              <span class="flex items-center gap-1.5"
                ><span class="w-3 h-3 rounded bg-yellow-200 inline-block"></span
                >Holiday</span
              >
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="min-width: 180px">Student</th>
                  <th id="days-header"></th>
                  <th>Present</th>
                  <th>Absent</th>
                  <th>Rate</th>
                </tr>
              </thead>
              <tbody id="att-tbody"></tbody>
            </table>
          </div>
          <div
            class="px-4 py-3 border-t border-slate-100 dark:border-slate-700"
            id="att-pagination"
          ></div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
    <script src="components.js"></script>
    <script src="attendance.js"></script>
  </body>
</html>
