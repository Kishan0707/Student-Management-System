<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students — EduManage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100"
  >
    <div id="toast-container"></div>
    <div id="sidebar"></div>

    <div id="main-content">
      <header
        class="sticky top-0 z-40 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-6 py-3 flex items-center justify-between gap-4"
        id="navbar"
      ></header>

      <main class="p-6 page-enter">
        <!-- Toolbar -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div class="flex flex-wrap items-center gap-3">
            <div class="search-bar w-64">
              <svg
                class="w-4 h-4 text-slate-400 flex-shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"
                />
              </svg>
              <input
                id="search-input"
                type="text"
                placeholder="Search students…"
                oninput="filterStudents()"
              />
            </div>
            <select
              id="class-filter"
              onchange="filterStudents()"
              class="form-input w-36 py-2"
            >
              <option value="">All Classes</option>
              <option>10-A</option>
              <option>10-B</option>
              <option>11-A</option>
              <option>11-B</option>
              <option>12-A</option>
              <option>12-B</option>
            </select>
            <select
              id="status-filter"
              onchange="filterStudents()"
              class="form-input w-36 py-2"
            >
              <option value="">All Status</option>
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <button
              onclick="exportStudents()"
              class="btn btn-secondary text-sm"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                />
              </svg>
              Export CSV
            </button>
            <button onclick="openAddModal()" class="btn btn-primary text-sm">
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Add Student
            </button>
          </div>
        </div>

        <!-- Table Card -->
        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th class="hide-mobile">Roll No</th>
                  <th class="hide-mobile">Class</th>
                  <th class="hide-mobile">Contact</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="students-tbody">
                <!-- Skeleton -->
                <tr>
                  <td colspan="6" class="p-4">
                    <div class="skeleton h-10 w-full"></div>
                  </td>
                </tr>
                <tr>
                  <td colspan="6" class="p-4">
                    <div class="skeleton h-10 w-full"></div>
                  </td>
                </tr>
                <tr>
                  <td colspan="6" class="p-4">
                    <div class="skeleton h-10 w-full"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div
            class="px-4 py-3 border-t border-slate-100 dark:border-slate-700 flex flex-wrap items-center gap-3"
            id="pagination-container"
          ></div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Modal -->
    <div
      id="student-modal"
      class="modal-overlay"
      onclick="if (event.target === this) Modal.close('student-modal');"
    >
      <div class="modal-box">
        <div class="flex items-center justify-between mb-6">
          <h2
            id="modal-title"
            class="text-xl font-bold text-slate-800 dark:text-slate-100"
          >
            Add Student
          </h2>
          <button
            onclick="Modal.close('student-modal')"
            class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <form id="student-form" onsubmit="saveStudent(event)" novalidate>
          <input type="hidden" name="id" />
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="form-label">Full Name *</label>
              <input name="name" class="form-input" placeholder="John Doe" />
              <div class="form-error" data-error="name"></div>
            </div>
            <div>
              <label class="form-label">Roll Number *</label>
              <input name="rollNo" class="form-input" placeholder="STU001" />
              <div class="form-error" data-error="rollNo"></div>
            </div>
            <div>
              <label class="form-label">Email *</label>
              <input
                name="email"
                type="email"
                class="form-input"
                placeholder="student@school.edu"
              />
              <div class="form-error" data-error="email"></div>
            </div>
            <div>
              <label class="form-label">Phone *</label>
              <input
                name="phone"
                class="form-input"
                placeholder="+1-555-0000"
              />
              <div class="form-error" data-error="phone"></div>
            </div>
            <div>
              <label class="form-label">Class *</label>
              <select name="class" class="form-input">
                <option value="">Select class</option>
                <option>10-A</option>
                <option>10-B</option>
                <option>11-A</option>
                <option>11-B</option>
                <option>12-A</option>
                <option>12-B</option>
              </select>
              <div class="form-error" data-error="class"></div>
            </div>
            <div>
              <label class="form-label">Date of Birth</label>
              <input name="dob" type="date" class="form-input" />
            </div>
            <div>
              <label class="form-label">Gender</label>
              <select name="gender" class="form-input">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label class="form-label">Status</label>
              <select name="status" class="form-input">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="form-label">Address</label>
              <input
                name="address"
                class="form-input"
                placeholder="123 Main St, City"
              />
            </div>
          </div>
          <div class="flex justify-end gap-3 mt-6">
            <button
              type="button"
              onclick="Modal.close('student-modal')"
              class="btn btn-secondary"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Student</button>
          </div>
        </form>
      </div>
    </div>

    <!-- View Modal -->
    <div
      id="view-modal"
      class="modal-overlay"
      onclick="if (event.target === this) Modal.close('view-modal');"
    >
      <div class="modal-box">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">
            Student Details
          </h2>
          <button
            onclick="Modal.close('view-modal')"
            class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div id="view-content"></div>
      </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div
      id="delete-modal"
      class="modal-overlay"
      onclick="if (event.target === this) Modal.close('delete-modal');"
    >
      <div class="modal-box max-w-sm text-center">
        <div
          class="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4"
        >
          <svg
            class="w-8 h-8 text-red-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-2">
          Delete Student?
        </h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
          This action cannot be undone. All associated data will be removed.
        </p>
        <div class="flex justify-center gap-3">
          <button
            onclick="Modal.close('delete-modal')"
            class="btn btn-secondary"
          >
            Cancel
          </button>
          <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script src="components.js"></script>
    <script src="students.js"></script>
  </body>
</html>
